version: "3"
containers:
- name: cloud-client
  image: gcr.io/instruqt/cloud-client
  shell: /bin/bash
  ports:
  - 80
  environment:
    LANG: C.UTF-8
  memory: 1024
  resources:
    memory: 1024
gcp_projects:
- name: northwinddev
  services:
  - cloudresourcemanager.googleapis.com
  - serviceusage.googleapis.com
  - iamcredentials.googleapis.com
  - iam.googleapis.com
  - storage.googleapis.com
  - artifactregistry.googleapis.com
  - run.googleapis.com
  regions:
  - us-central1
  roles:
  - roles/browser
  - roles/serviceusage.serviceUsageAdmin
  - roles/iam.serviceAccountAdmin
  - roles/iam.roleAdmin
  - roles/resourcemanager.projectIamAdmin
  - roles/iam.securityReviewer
  - roles/storage.admin
- name: northwindstaging
  services:
  - cloudresourcemanager.googleapis.com
  - serviceusage.googleapis.com
  - iamcredentials.googleapis.com
  - iam.googleapis.com
  - storage.googleapis.com
  - artifactregistry.googleapis.com
  - run.googleapis.com
  regions:
  - us-central1
  roles:
  - roles/browser
  - roles/serviceusage.serviceUsageAdmin
  - roles/iam.serviceAccountAdmin
  - roles/iam.roleAdmin
  - roles/resourcemanager.projectIamAdmin
  - roles/iam.securityReviewer
