title: Week 1 — GCP Organization, Projects and Identity
teaser: Build a small, secure multi-project foundation on Google Cloud by hand - hierarchy,
  APIs, IAM, service accounts, impersonation, IAM Conditions, org policies and a real
  access-denied failure drill.
description: |-
  You just joined the platform team at **Northwind Payments** (a fictional company). Two brand-new Google Cloud projects - **dev** and **staging** - have been vended for a new service. Nothing is set up yet.

  In this track you will:

  - explore the **resource hierarchy** (organization → folder → project), billing and project boundaries
  - set up **one gcloud identity per project** and **enable APIs** with `gcloud`, documenting who did what
  - compare **predefined vs custom roles** and build a least-privilege **developer** identity
  - use **service account impersonation** instead of keys
  - build a least-privilege **deployment pipeline** identity with a narrowly scoped `actAs`
  - grant **time-bound, cross-project** access with **IAM Conditions**
  - hit the **org-policy guard-rails** (allowed APIs, locations) and read **quotas**
  - run a **failure drill**: remove a permission, diagnose the access denial (testIamPermissions + bindings + role), and compare a broad vs the narrowest fix

  **Deliverable:** identity map, API enablement notes, CLI command log and a least-privilege table.

  Every step tells you *what* to achieve - the exact commands are hidden until you open them.
